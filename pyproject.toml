[project]
name = "agentlens"
version = "1.0.0"
description = "AgentLens - diagnose why AI agents fail on an ecommerce site"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "duckdb>=1.1",
  "pyarrow>=17",
  "typer>=0.12",
  "cryptography>=43",
  "httpx>=0.27",
  "pyyaml>=6",
  "faker>=28",
  "playwright>=1.47",
  "openai>=1.50",
  "python-dotenv>=1.0",
  "numpy>=1.26",
  "orjson>=3.13.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "pip-audit",
]

[project.scripts]
agentlens = "agentlens.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The repo layout keeps services/api, services/replay and services/synth as sibling folders (PRD 27.2),
# but they all import as the single `agentlens` package: agentlens.*, agentlens.replay, agentlens.synth.
[tool.setuptools]
packages = [
  "agentlens", "agentlens.ingest", "agentlens.identify", "agentlens.sessions", "agentlens.diagnosis", "agentlens.eval",
  "agentlens.replay", "agentlens.synth",
]
package-dir = { "agentlens" = "services/api", "agentlens.replay" = "services/replay", "agentlens.synth" = "services/synth" }

[tool.setuptools.package-data]
"agentlens" = ["schema.sql"]
"agentlens.identify" = ["bundled_keys.json"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["services", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests/python"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

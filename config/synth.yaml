        sec_ch_ua: '"Chromium";v="129", "Not_A Brand";v="24"'

  crawler:
    share: 0.05
    behavior: crawler
    tier: declared
    ip_pool: "dc:66.249"
    keeps_cookies: 0.0
    js: false
    assets: false
    beacon: 0.0
    sec_fetch: 0.0
    accept: any
    think: { kind: lognormal, median: 2.0, sigma: 0.3 }
    pages: [8, 40]
    uas:
      - { ua: "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)", name: Googlebot, operator: Google, class: search_crawler, weight: 3, robots: Googlebot }
      - { ua: "Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko; compatible; GPTBot/1.1; +https://openai.com/gptbot)", name: GPTBot, operator: OpenAI, class: training_crawler, weight: 2, robots: GPTBot }
      - { ua: "CCBot/2.0 (https://commoncrawl.org/faq/)", name: CCBot, operator: Common Crawl, class: training_crawler, weight: 1, robots: CCBot }
      - { ua: "Mozilla/5.0 (compatible; ClaudeBot/1.0; +claudebot@anthropic.com)", name: ClaudeBot, operator: Anthropic, class: training_crawler, weight: 1, robots: ClaudeBot }
      - { ua: "Mozilla/5.0 (compatible; Applebot/0.1; +http://www.apple.com/go/applebot)", name: Applebot, operator: Apple, class: search_crawler, weight: 1, robots: Applebot }

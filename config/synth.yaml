noise:
  p_server_error: 0.004       # random 5xx on pages
  p_random_abandon: 0.03      # agents/humans that simply stop mid-journey
  p_flaky_api_retry: 0.01     # transient API failure that clients retry
  duration_ms: { page_median: 90, page_sigma: 0.5, api_median: 35, api_sigma: 0.5, asset_median: 12, asset_sigma: 0.4 }
